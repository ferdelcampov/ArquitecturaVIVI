<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revista | Viviana — Architecture Portfolio</title>
    <link rel="icon" type="image/png" href="assets/faviconvivi.png" />

    <meta
      name="description"
      content="Revista: an editorial spread, browsable page by page like a printed magazine."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <header class="hero hero-compact" style="--hero-image:url('assets/revista/portada%201.png')">
      <nav class="nav">
        <a class="brand" href="index.html">Viviana</a>
        <div class="nav-links">
          <a href="index.html#projects">Projects</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </nav>

      <div class="hero-content">
        <a class="back-link" href="index.html#projects">← Back to projects</a>
        <p class="eyebrow">Editorial · Publication</p>
        <h1>Magazine</h1>
        <p>An editorial spread — browse it page by page, like a printed magazine.</p>
      </div>
    </header>

  
    <main>
      <section class="section">
        <div class="magazine-viewer" aria-label="Magazine viewer">
          <div class="magazine-stage">
            <button class="magazine-arrow magazine-prev" type="button" aria-label="Previous page">←</button>

            <div class="magazine-page-wrap">
              <img id="magazine-page" src="assets/revista/portada%201.png" alt="Revista, cover" />
            </div>

            <button class="magazine-arrow magazine-next" type="button" aria-label="Next page">→</button>
          </div>

          <div class="magazine-footer">
            <p class="magazine-counter">
              <span id="magazine-current">Cover</span>
              <span aria-hidden="true">/</span>
              <span id="magazine-total">12</span>
            </p>

            <div class="magazine-thumbs" id="magazine-thumbs" aria-label="Jump to page"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="next-project">
          <p style="margin:0; font-weight:600;">Want to see more projects?</p>
          <a class="btn" href="index.html#projects" style="margin-top:0;">Back to portfolio</a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 Viviana. Architecture portfolio.</p>
    </footer>

    <script src="Revista.js"></script>
  </body>
</html>
